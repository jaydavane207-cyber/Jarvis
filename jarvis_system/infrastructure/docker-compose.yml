version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jarvis_user
      POSTGRES_PASSWORD: jarvis_password
      POSTGRES_DB: jarvis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: jarvis_user
      RABBITMQ_DEFAULT_PASS: jarvis_password
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://jarvis_user:jarvis_password@postgres/jarvis_db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://jarvis_user:jarvis_password@rabbitmq:5672/
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
