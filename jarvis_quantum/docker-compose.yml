version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: jarvis_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretQuantumPass123!}
      POSTGRES_DB: jarvis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://jarvis_admin:${POSTGRES_PASSWORD:-SuperSecretQuantumPass123!}@db:5432/jarvis_db
      - SECRET_KEY=${SECRET_KEY:-simulated_quantum_random_string_xyz}
    depends_on:
      - db

volumes:
  postgres_data:
